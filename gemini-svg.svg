<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景深色渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <!-- 钻石外框渐变 -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- 内部高光渐变 -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.05" />
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 圆角矩形底板 (适配 GitHub 组织头像框) -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <g filter="url(#glow)">
    <!-- 超人五边形钻石外轮廓 -->
    <polygon points="126,96 386,96 456,206 256,436 56,206" fill="url(#shieldGrad)" />
    
    <!-- 钻石内胆深色背景 -->
    <polygon points="142,122 370,122 424,206 256,398 88,206" fill="#0B0F19" />
    
    <!-- 内部玻璃质感切面 -->
    <polygon points="142,122 370,122 424,206 256,398 88,206" fill="url(#innerGrad)" />
    <polygon points="142,122 256,122 256,398 88,206" fill="#FFFFFF" fill-opacity="0.04" />

    <!-- 核心几何 'T' 徽章 (与钻石边框无缝融合，致敬超人 S 的镶嵌感) -->
    <polygon points="154,142 358,142 396,202 286,202 286,348 256,382 226,348 226,202 116,202" fill="url(#shieldGrad)" />
    
    <!-- 顶部几何高光倒角 -->
    <polygon points="154,142 358,142 342,162 170,162" fill="#BAE6FD" fill-opacity="0.4" />
  </g>
</svg>